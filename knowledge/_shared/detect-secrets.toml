[tool]
name = "detect-secrets"
category = "security"
homepage = "https://github.com/Yelp/detect-secrets"
docs = "https://github.com/Yelp/detect-secrets#readme"
repo = "https://github.com/Yelp/detect-secrets"
description = "Secret scanner with baseline support"

[detect]
files = [".secrets.baseline"]
dependencies = ["detect-secrets"]
dev_dependencies = ["detect-secrets"]

[commands]
run = "detect-secrets scan"

[config]
files = [".secrets.baseline"]

[taxonomy]
function = ["security-scanning"]
