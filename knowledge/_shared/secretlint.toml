[tool]
name = "Secretlint"
category = "security"
homepage = "https://secretlint.github.io"
docs = "https://github.com/secretlint/secretlint#readme"
repo = "https://github.com/secretlint/secretlint"
description = "Pluggable secret linter for text and source files"

[detect]
files = [".secretlintrc.json", ".secretlintrc.yml", ".secretlintrc.yaml", ".secretlintrc.js", ".secretlintignore"]
dependencies = ["secretlint"]
dev_dependencies = ["secretlint"]

[commands]
run = "secretlint \"**/*\""

[config]
files = [".secretlintrc.json", ".secretlintrc.yml", ".secretlintrc.yaml", ".secretlintrc.js", ".secretlintignore"]

[taxonomy]
function = ["security-scanning"]
