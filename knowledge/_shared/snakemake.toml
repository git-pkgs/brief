[tool]
name = "Snakemake"
category = "build"
homepage = "https://snakemake.github.io"
docs = "https://snakemake.readthedocs.io/en/stable/"
repo = "https://github.com/snakemake/snakemake"
description = "Workflow system for reproducible data analysis"

[detect]
files = ["Snakefile", "snakefile", "**/Snakefile", "**/snakefile", "*.smk", "**/*.smk"]
dependencies = ["snakemake"]
dev_dependencies = ["snakemake"]

[commands]
run = "snakemake"

[config]
files = ["Snakefile", "snakefile", "**/Snakefile", "**/snakefile", "*.smk", "**/*.smk"]

[taxonomy]
role = ["orchestrator"]
function = ["workflow-orchestration"]
domain = ["research", "scientific-computing"]
technology = ["snakemake"]
