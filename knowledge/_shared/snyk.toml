[tool]
name = "Snyk"
category = "security"
homepage = "https://snyk.io"
docs = "https://docs.snyk.io"
description = "Developer security platform"

[detect]
files = [".snyk"]
dependencies = ["snyk", "snyk/actions/cocoapods", "snyk/actions/docker", "snyk/actions/dotnet", "snyk/actions/golang", "snyk/actions/gradle", "snyk/actions/iac", "snyk/actions/maven", "snyk/actions/node", "snyk/actions/php", "snyk/actions/python", "snyk/actions/ruby", "snyk/actions/scala", "snyk/actions/setup"]
dev_dependencies = ["snyk"]

[commands]
run = "snyk test"

[config]
files = [".snyk"]

[taxonomy]
function = ["security-scanning"]
